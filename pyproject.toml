[project]
name = "reconnaissance"
version = "0.1.0"
description = "Web application reconnaissance — deterministic tool pipeline with an optional agent layer"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
agent = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "types-PyYAML>=6.0", "anthropic>=0.40"]

[project.scripts]
reconnaissance = "reconnaissance.__main__:main"
reconnaissance-web = "reconnaissance.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reconnaissance*"]

[tool.ruff]
line-length = 200
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "TID", "G", "LOG"]
ignore = ["N806"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
markers = ["integration: requires real DB/binaries/network"]
addopts = "-m 'not integration'"
